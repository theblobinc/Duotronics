map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# OpenAI-compatible API gateway for the Ollama tunnel on this host.
#
# Expects an auth snippet at:
#   /etc/nginx/snippets/api.xavi.app.auth.conf
# which should define a variable:
#   $api_xavi_app_authorized = 0/1
#
# Example snippet contents:
#   set $api_xavi_app_authorized 0;
#   if ($http_authorization = "Bearer REPLACE_WITH_STRONG_KEY") { set $api_xavi_app_authorized 1; }

server {
    server_name api.xavi.app;

    access_log /var/log/nginx/api.xavi.app.access.log;
    error_log  /var/log/nginx/api.xavi.app.error.log;

    client_max_body_size 512m;

    # Health check (no auth).
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # OpenAI-compatible Ollama endpoints (auth required).
    location /v1/ {
        include /etc/nginx/snippets/api.xavi.app.auth.conf;
        if ($api_xavi_app_authorized = 0) { return 401; }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Optional: redirect /v1 -> /v1/
    location = /v1 {
        return 308 /v1/;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.xavi.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.xavi.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.xavi.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name api.xavi.app;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}