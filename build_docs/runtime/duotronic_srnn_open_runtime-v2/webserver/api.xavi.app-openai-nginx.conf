# Xavi Developer MCP HA pool. Instances are drained by removing them here and gracefully reloading nginx.
upstream xavi_dev_mcp_pool {
    least_conn;
    server 127.0.0.1:8092 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8093 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8094 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# OpenAI-compatible and token-path MCP gateway.
#
# The OpenAI-compatible /v1 routes and /mcp/interpreter continue to use the
# Authorization-based snippet at /etc/nginx/snippets/api.xavi.app.auth.conf.
# The general and operations MCP endpoints use exact, unguessable path tokens;
# invalid or missing tokens deliberately return 404 rather than disclosing an
# authenticated service.

server {
    server_name api.xavi.app;

    access_log /var/log/nginx/api.xavi.app.access.log;
    error_log  /var/log/nginx/api.xavi.app.error.log;

    client_max_body_size 512m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Compatibility alias for the existing ChatGPT operations connector.
    location = /chatgpt/ops/dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00 {
        proxy_pass http://xavi_dev_mcp_pool/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization "Bearer dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00";
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Token-path operations MCP. The token is stripped before proxying.
    location = /mcp/ops/dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00 {
        proxy_pass http://xavi_dev_mcp_pool/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization "Bearer dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00";
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Token-path general runtime MCP. The token is stripped before proxying.
    location = /mcp/dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00 {
        proxy_pass http://127.0.0.1:8080/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization "Bearer dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00";
        proxy_set_header X-Xavi-Mcp-Key "dd35a211f9325a33dabb726109da40ab03fc3c74b68725ab88b74f1bae0b9a00";
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # MCP endpoint for Xavi code/math/data interpreter (bearer auth retained).
    location = /mcp/interpreter {
        include /etc/nginx/snippets/api.xavi.app.auth.conf;
        if ($api_xavi_app_authorized = 0) { return 401; }

        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hide missing or invalid MCP path tokens.
    location = /mcp {
        return 404;
    }

    location = /mcp/ops {
        return 404;
    }

    location ^~ /mcp/ops/ {
        return 404;
    }

    location ^~ /mcp/ {
        return 404;
    }

    # OpenAI-compatible runtime v3 endpoints (bearer auth required).
    location /v1/ {
        include /etc/nginx/snippets/api.xavi.app.auth.conf;
        if ($api_xavi_app_authorized = 0) { return 401; }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /v1 {
        return 308 /v1/;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.xavi.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.xavi.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.xavi.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name api.xavi.app;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
