      responses:
        '200':
          description: Replay assumption manifest
          content:
            application/json:
              schema:
                $ref: ../../schemas/replay_assumption_manifest.schema.json
  /replay/signs:
    post:
      summary: Register a replay sign.
      operationId: createReplaySign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/replay_sign.schema.json
      responses:
        '200':
          description: Replay sign
          content:
            application/json:
              schema:
                $ref: ../../schemas/replay_sign.schema.json
  /replay/verification-grammars:
    post:
      summary: Register deterministic verification grammar.
      operationId: createVerificationGrammar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/verification_grammar.schema.json
      responses:
        '200':
          description: Verification grammar
          content:
            application/json:
              schema:
                $ref: ../../schemas/verification_grammar.schema.json
  /replay/deep-time/verify:
    post:
      summary: Verify a deep-time replay package.
      operationId: verifyDeepTimeReplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - target_ref
              - grammar_id
              - manifest_id
              properties:
                target_ref:
                  type: string
                  minLength: 1
                grammar_id:
                  type: string
                  minLength: 1
                manifest_id:
                  type: string
                  minLength: 1
                replay_sign_refs:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: ../../schemas/verification_result.schema.json
        '409':
          $ref: '#/components/responses/ReplayAssumptionViolation'
  /kernel/observers:
