openapi: 3.1.0
info:
  title: Duotronic Evidence Language API
  version: v1.6-draft-5.2.1-lean-proof-authority
  description: Draft 5.2 evidence-language runtime surface. This API is additive and
    must not weaken Draft 5.1 authority, NLA, replay, or release gates. Draft 5.2.1
    adds Lean/Lake proof authority endpoints and theorem promotion gates.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths:
  /evidence/claims:
    post:
      summary: Create a first-class atomic evidence claim.
      description: The runtime MUST reject direct theorem/proof_verified claim creation
        unless the request includes non-empty proof_witness_refs and a status_transition_id
        referencing a claim_status_transition/v1 record.
      operationId: createEvidenceClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/evidence_claim.schema.json
      responses:
        '200':
          description: Evidence claim accepted
          content:
            application/json:
              schema:
                $ref: ../../schemas/evidence_claim.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /evidence/claims/status-transitions:
    post:
      summary: Record a claim status transition under non-collapse and policy locks.
      operationId: createClaimStatusTransition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/claim_status_transition.schema.json
      responses:
        '200':
          description: Status transition recorded
          content:
            application/json:
              schema:
                $ref: ../../schemas/claim_status_transition.schema.json
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /evidence/claims/compound:
    post:
      summary: Create a compound claim witness.
      operationId: createCompoundClaimWitness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/compound_claim_witness.schema.json
      responses:
        '200':
          description: Compound claim witness
          content:
            application/json:
              schema:
                $ref: ../../schemas/compound_claim_witness.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
  /evidence/composition-policies:
    post:
      summary: Register a composition policy.
      operationId: createCompositionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/composition_policy.schema.json
      responses:
        '200':
          description: Composition policy
          content:
            application/json:
              schema:
                $ref: ../../schemas/composition_policy.schema.json
  /evidence/inferences:
    post:
      summary: Create an inference witness.
      operationId: createInferenceWitness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference_witness.schema.json
      responses:
        '200':
          description: Inference witness
          content:
            application/json:
              schema:
                $ref: ../../schemas/inference_witness.schema.json
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /evidence/pragmatic-contexts:
    post:
      summary: Create pragmatic authority context for a claim, action, or inference.
      operationId: createPragmaticContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/pragmatic_context.schema.json
      responses:
        '200':
          description: Pragmatic context
          content:
            application/json:
              schema:
                $ref: ../../schemas/pragmatic_context.schema.json
  /policy/evidence-extensions:
    post:
      summary: Attach evidence-language force and non-collapse details to a policy
        decision.
      operationId: createPolicyDecisionEvidenceExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/policy_decision_evidence_extension.schema.json
      responses:
        '200':
          description: Policy evidence extension
          content:
            application/json:
              schema:
                $ref: ../../schemas/policy_decision_evidence_extension.schema.json
  /authority/delegations:
    post:
      summary: Register an authority delegation chain.
      operationId: createAuthorityDelegationChain
      requestBody:
        required: true
        content:
