        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
components:
  responses:
    BadEvidenceRequest:
      description: The request failed schema validation or omitted required authority
        context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NonCollapseViolation:
      description: The request attempted a forbidden epistemic, semantic, or authority
        collapse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ReplayAssumptionViolation:
      description: Deep-time replay assumptions were missing, unsatisfied, or unverifiable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          enum:
          - schema_validation_failed
          - missing_pragmatic_context
          - non_collapse_violation
          - replay_assumption_violation
          - authority_denied
          - verification_failed
          - missing_witness
          - replay_assumption_missing
          - indeterminate_result
          - human_review_required
          - resource_budget_exceeded
          - canonical_rule_ambiguous
          - capability_denied
          - lean_compiler_failed
          - lean_toolchain_unavailable
          - sorry_stub_detected
          - unapproved_axiom_detected
          - theorem_source_hash_mismatch
        message:
          type: string
        evidence_ref:
          type:
          - string
          - 'null'
        policy_decision_id:
          type:
          - string
          - 'null'
