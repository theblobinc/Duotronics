      responses:
        '200':
          description: Non-collapse state
          content:
            application/json:
              schema:
                $ref: ../../schemas/non_collapse_state.schema.json
  /non-collapse/transitions:
    post:
      summary: Evaluate and record a non-collapse transition.
      operationId: createNonCollapseTransition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/non_collapse_transition.schema.json
      responses:
        '200':
          description: Non-collapse transition
          content:
            application/json:
              schema:
                $ref: ../../schemas/non_collapse_transition.schema.json
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /replay/assumptions:
