          description: Record task result witness
          content:
            application/json:
              schema:
                $ref: ../../schemas/task_result_witness.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /kernel/transactions:
    post:
      summary: Open or commit evidence transaction
      operationId: createKernelTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/kernel_transaction.schema.json
      responses:
