        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /kernel/tasks:
    post:
      summary: Create logical observer task
      operationId: createObserverTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/observer_task.schema.json
      responses:
        '200':
          description: Create logical observer task
          content:
            application/json:
              schema:
                $ref: ../../schemas/observer_task.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /kernel/task-frames:
    post:
      summary: Create replayable task frame
      operationId: createTaskFrame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/task_frame.schema.json
      responses:
        '200':
