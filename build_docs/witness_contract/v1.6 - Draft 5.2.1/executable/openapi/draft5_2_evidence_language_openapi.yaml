          description: Resolve active canonical corpus rule
          content:
            application/json:
              schema:
                $ref: ../../schemas/corpus_rule_resolution_witness.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /kernel/conflict-adjudications:
    post:
      summary: Record conflict adjudication witness
      operationId: createConflictAdjudicationWitness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/conflict_adjudication_witness.schema.json
      responses:
        '200':
          description: Record conflict adjudication witness
          content:
            application/json:
              schema:
                $ref: ../../schemas/conflict_adjudication_witness.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /kernel/states:
    post:
      summary: Record serializable kernel state
      operationId: createKernelState
      requestBody:
        required: true
        content:
          application/json:
