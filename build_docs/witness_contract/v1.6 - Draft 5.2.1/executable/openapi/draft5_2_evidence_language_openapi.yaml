      summary: Record a theorem promotion gate for proof-backed claim promotion.
      operationId: createTheoremPromotionGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/theorem_promotion_gate.schema.json
      responses:
