  /proof/witnesses:
    post:
      summary: Record a proof witness bound to a Lean compiler witness.
      operationId: createProofWitness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/proof_witness.schema.json
      responses:
        '200':
          description: Proof witness recorded
          content:
            application/json:
              schema:
                $ref: ../../schemas/proof_witness.schema.json
        '400':
          $ref: '#/components/responses/BadEvidenceRequest'
        '409':
          $ref: '#/components/responses/NonCollapseViolation'
  /proof/theorem-promotion-gates:
