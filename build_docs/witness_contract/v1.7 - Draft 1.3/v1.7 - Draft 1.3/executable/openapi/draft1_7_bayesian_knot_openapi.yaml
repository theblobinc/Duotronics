  /bayesian/model:
    post:
      tags: [bayesian]
      summary: Register bayesian_model object
      operationId: register_bayesian_model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/bayesian_model.schema.json
      responses:
        '200':
          $ref: "#/components/responses/AcceptedWitness"
        '400':
          $ref: "#/components/responses/SemanticValidationError"
        '409':
          $ref: "#/components/responses/ConflictWitness"
    get:
      tags: [bayesian]
      summary: Lookup bayesian_model object
      operationId: lookup_bayesian_model
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          $ref: "#/components/responses/WitnessLookup"
        '404':
