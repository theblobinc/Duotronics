openapi: 3.1.0
info:
  title: Duotronic Witness Contract v1.7 Draft 1.3 Bayesian and Knot Runtime Surface
  version: v1.7-draft-1.3
  description: Schema-SQL-runtime consistency surface with structured validation and rejection responses.
tags:
  - name: bayesian
    description: v1.7-draft-1.3 Bayesian witness endpoints
  - name: knot
    description: v1.7-draft-1.3 knot witness endpoints
  - name: validation
    description: v1.7-draft-1.3 validation report endpoints
