components:
  schemas:
    AcceptedWitness:
      type: object
      required: [status, witness_ref]
      properties:
        status: {const: accepted_candidate}
        witness_ref: {type: string}
        validation_report_ref: {type: string}
    SemanticValidationError:
      type: object
      required: [status, corpus_errors]
      properties:
        status: {const: rejected_semantic_validation}
        corpus_errors:
          type: array
          items: {type: string}
        environment_warnings:
          type: array
          items: {type: string}
        toolchain_warnings:
          type: array
          items: {type: string}
    ConflictWitness:
      type: object
      required: [status, conflict_kind]
      properties:
        status: {const: rejected_conflict}
        conflict_kind: {type: string}
        conflicting_witness_ref: {type: string}
    WitnessLookup:
      type: object
      properties:
        status: {const: found}
        witness: {type: object}
    ValidationReport:
      type: object
      properties:
        status: {type: string}
        corpus_errors:
          type: array
          items: {type: string}
        checks:
          type: array
          items: {type: object}
    NotFound:
      type: object
      properties:
        status: {const: not_found}
  responses:
    AcceptedWitness:
      description: Witness accepted as candidate after schema and semantic validation gates.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedWitness"
    SemanticValidationError:
      description: Witness rejected by schema, semantic, policy, or non-collapse validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SemanticValidationError"
    ConflictWitness:
      description: Witness conflicts with an existing witness or policy requirement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictWitness"
    WitnessLookup:
      description: Witness lookup response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WitnessLookup"
    ValidationReport:
      description: Structured validation report response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationReport"
    NotFound:
      description: Object was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFound"


x-duotronic-error-codes:
  BAYES_DUPLICATE_HYPOTHESIS_ID: duplicate Bayesian hypothesis identifiers are rejected before persistence
  KNOT_PD_ARC_MULTIPLICITY: PD code arc labels must appear exactly twice
  KNOT_GAUSS_LABEL_MULTIPLICITY: Gauss crossing labels must appear exactly twice
  KNOT_DT_PARITY: Dowker-Thistlethwaite entries must satisfy even-label constraints
  KNOT_GRID_ROW_COLUMN_UNIQUENESS: grid diagrams require one X and one O per row/column
  KNOT_BRAID_GENERATOR_BOUNDS: braid closure generators must be inside strand bounds

x-duotronic-examples:
  bayesian_replay_output:
    replay_witness_id: bayes-replay:knot-candidate:v1
    computed_normalization_constant: 0.56
    computed_posterior_distribution:
      - hypothesis_id: same_knot_type
        probability: 0.8571428571428571
      - hypothesis_id: different_knot_type
        probability: 0.14285714285714285
  semantic_rejection:
    error_code: BAYES_DUPLICATE_HYPOTHESIS_ID
    conflict_kind: semantic_validation_failure
    witness_family: bayesian_prior
