- promote_knot_equivalence_without_authority_path
- discard_knot_orientation_without_policy
- treat_invariant_equality_as_knot_equivalence
- treat_bayesian_decision_as_policy_approval
- promote_posterior_to_truth_without_proof
- accept_bayesian_update_without_replay_or_bound
- accept_complete_invariant_without_completeness_witness
- accept_canonical_hash_without_collision_policy
- network_fetch
- random_sample
- wall_clock_now
- hidden_state_write
- replace_authority
- delete_evidence
- promote_without_witness
- promote_theorem_without_lean_compiler_witness
- promote_theorem_with_sorry_or_admit
- promote_theorem_with_unapproved_axiom
- promote_theorem_with_source_hash_mismatch
invariants:
- K1. No effect before witness.
- K2. No promotion without policy decision.
- K3. No theorem/proof status without proof witness, Lean compiler witness, and theorem promotion gate.
- K4. No authority escalation by repetition.
- K5. No self-trained-to-authoritative transition without gate path.
- K6. No replay claim without assumptions and deterministic grammar.
- K7. No hidden state in observer computation.
- K8. No network, randomness, or wall-clock dependency in replay mode.
- K9. Every refusal is itself a typed witness.
- K10. Every ambiguity resolves to deny, defer, fork, or human escalation.
- K11. Posterior probability is not proof, truth, theorem, policy approval, or human attestation.
- K12. Bayesian decision is not policy approval unless a policy decision witness separately authorizes it.
- K13. Knot diagram identity is not knot-type equivalence unless witnessed by a declared equivalence path.
- K14. Invariant equality is not equivalence unless the invariant is declared complete for the domain and backed by proof authority.
- K15. Reidemeister traces are mathematical transition witnesses and must preserve source and target diagram references.
- K16. Bayesian model identity, prior, likelihood, update, posterior, and replay must share one hypothesis space.
- K17. Log-likelihood values are not probability values and require log-space replay semantics.
- K18. Knot braid words are first-class presentations, not fallback diagram metadata.
- K19. Knot equivalence authority paths are first-class objects, not inline JSON authority strings.
- K20. Canonical form hashes require declared canonicalization domain and collision policy.
