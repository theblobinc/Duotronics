syscalls:
- name: observe
  purpose: Record an observation
  required_witness:
  - EvidenceClaim
- name: compose
  purpose: Build compound claim
  required_witness:
  - CompoundClaimWitness
- name: infer
  purpose: Derive proposal from premises
  required_witness:
  - InferenceWitness
- name: verify
  purpose: Run deterministic verification
  required_witness:
  - VerificationResult
- name: replay
  purpose: Reconstruct from assumptions and grammar
  required_witness:
  - ReplayAssumptionManifest
  - VerificationResult
- name: delegate
  purpose: Transfer bounded authority
  required_witness:
  - AuthorityDelegationChain
- name: promote
  purpose: Change claim, model, or status authority
  required_witness:
  - ClaimStatusTransition
  - NonCollapseTransition
- name: compute
  purpose: Run bounded deterministic computation
  required_witness:
  - TaskStepWitness
  - TaskResultWitness
- name: adjudicate
  purpose: Resolve conflict
  required_witness:
  - ConflictAdjudicationWitness
- name: rollback
  purpose: Undo failed transaction
  required_witness:
  - KernelTransaction
- name: export
  purpose: Produce replayable bundle
  required_witness:
  - ReplaySign
  - VerificationGrammar
- name: check_proof
  purpose: Compile and verify Lean proof artifacts for theorem/proof promotion
  required_witness:
  - LeanCompilerWitness
  - ProofWitness
- name: bayes_model
  purpose: Register Bayesian model and hypothesis space
  required_witness:
  - BayesianModel
- name: bayes_update
  purpose: Update Bayesian posterior from model, prior, likelihood, and observation evidence
  required_witness:
  - BayesianModel
  - BayesianPrior
  - BayesianLikelihood
  - EvidenceClaim
  - BayesianUpdateWitness
- name: bayes_replay_update
  purpose: Recompute or bound a Bayesian posterior update
  required_witness:
  - BayesianModel
  - BayesianUpdateWitness
  - BayesianUpdateReplayWitness
- name: bayes_calibrate
  purpose: Record Bayesian calibration evidence
  required_witness:
  - BayesianModel
  - BayesianCalibrationReport
- name: bayes_decide
  purpose: Select a decision under posterior uncertainty and declared utility/loss model
  required_witness:
  - BayesianModel
  - BayesianPosteriorState
  - BayesianDecisionWitness
- name: knot_encode
  purpose: Register knot diagram or braid word presentation
  required_witness_any_of:
  - - KnotDiagramWitness
  - - KnotBraidWordWitness
- name: knot_move
  purpose: Record Reidemeister, braid, or diagram transition witness
  required_witness:
  - KnotReidemeisterMoveWitness
- name: knot_trace
  purpose: Register replayed Reidemeister or braid trace witness
  required_witness:
  - KnotReidemeisterTraceWitness
- name: knot_invariant
  purpose: Compute or register a knot invariant witness
  required_witness:
  - KnotInvariantWitness
- name: knot_invariant_completeness
  purpose: Bind an invariant completeness claim to proof authority and domain
  required_witness:
  - KnotInvariantWitness
  - KnotInvariantCompletenessWitness
- name: knot_canonicalize
  purpose: Register canonicalization and collision policy witness
  required_witness:
  - KnotCanonicalizationWitness
- name: knot_authority_path
  purpose: Register a first-class authority path for knot equivalence
  required_witness:
  - KnotEquivalenceAuthorityPath
- name: knot_equivalence
  purpose: Register knot equivalence claim with explicit first-class authority path
  required_witness:
  - KnotEquivalenceWitness
  - KnotEquivalenceAuthorityPath
