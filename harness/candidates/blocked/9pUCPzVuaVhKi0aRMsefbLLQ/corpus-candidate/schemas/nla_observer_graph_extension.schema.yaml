# NLA Observer Graph Extension Schema v1.0

schema_version: nla-observer-graph-extension/v1
status: active_draft5_schema

node_types:
  activation_capture_observer:
    inputs:
      - model_execution_event
      - source_model_ref
      - token_or_pooling_selector
    outputs:
      - activation_vector_ref
      - ActivationCaptureWitness
    forbidden_outputs:
      - user_memory_write
      - policy_authority_change

  activation_verbalizer_observer:
    inputs:
      - activation_vector_ref
      - nla_av_sidecar_ref
    outputs:
      - av_raw_text
      - explanation_text
      - parser_status
    forbidden_outputs:
      - direct_response_text
      - direct_memory_write

  activation_reconstructor_observer:
    inputs:
      - explanation_text
      - activation_vector_ref
      - nla_ar_sidecar_ref
    outputs:
      - reconstruction_vector_ref
      - mse
      - cosine_similarity
    forbidden_outputs:
      - policy_decision

  nla_fidelity_gate:
    inputs:
      - ActivationCaptureWitness
      - av_raw_text
      - explanation_text
      - reconstruction_metrics
      - sidecar_digest
    outputs:
      - NaturalLanguageActivationWitness
      - lifecycle_decision
    forbidden_outputs:
      - mutation_approval
      - memory_write

edge_rules:
  - from: activation_capture_observer
    to: activation_verbalizer_observer
    requires:
      - vector_shake256_512
      - d_model
      - layer_index
  - from: activation_verbalizer_observer
    to: activation_reconstructor_observer
    requires:
      - explanation_text
      - parser_status
  - from: activation_reconstructor_observer
    to: nla_fidelity_gate
    requires:
      - mse_or_unscored_status
      - cosine_or_unscored_status
  - from: nla_fidelity_gate
    to: wgrnn_contract_view
    mode: diagnostic_only

policy_defaults:
  mode: audit_only
  may_influence_response: false
  may_write_memory: false
  may_promote_witness: false
  may_trigger_mutation: false
